# dsh-plugin-dxpdf bundle patch — the loader row that activates the host half.
#
#   id:   loader-row id, used for patch targeting/disable, must be unique
#   name: the package specifier the loader imports. It must match this
#         package's `name` in package.json character for character.
#
# The plugin reads its optional configuration defensively, so this row needs
# no `config:` block. To override a default, add one — every field is optional:
#
#   - insert:
#       - id: dsh-plugin-dxpdf
#         name: 'dsh-plugin-dxpdf'
#         config:
#           timeoutMs: 300000
#           pythonPath: 'C:\nyaproxy\python\python.exe'
#           cliPath: 'C:\nyaproxy\python\Scripts\dxpdf_cli.py'
- insert:
    - id: dsh-plugin-dxpdf
      name: 'dsh-plugin-dxpdf'
